services:
  op-node:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.14.1
    container_name: liteverse-evm2-op-node
    extra_hosts:
      - "rpc.liteverse.xyz:172.28.0.11"
    networks:
      - default
      - besu_liteverse
    ports: !override
      - "9547:8547"
      - "9622:9222"
    command: >
      op-node
      --l1=${L1_RPC_URL}
      --l1.trustrpc
      --l1.beacon=${L1_BEACON_URL}
      --l1.beacon.ignore=true
      --l2=http://op-geth:8551
      --l2.jwt-secret=/workspace/jwt.txt
      --rollup.config=/workspace/rollup.json
      --rollup.l1-chain-config=/workspace/l1-op-node-genesis.json
      --sequencer.enabled=true
      --sequencer.stopped=false
      --sequencer.max-safe-lag=3600
      --verifier.l1-confs=1
      --p2p.disable
      --rpc.addr=0.0.0.0
      --rpc.port=8547
      --rpc.enable-admin
      --log.level=info
      --log.format=json

  op-geth:
    container_name: liteverse-evm2-op-geth
    ports: !override
      - "9545:8545"
      - "9546:8546"
      - "9551:8551"

  batcher:
    container_name: liteverse-evm2-op-batcher
    extra_hosts:
      - "rpc.liteverse.xyz:172.28.0.11"
    networks:
      - default
      - besu_liteverse

  proposer:
    container_name: liteverse-evm2-op-proposer
    extra_hosts:
      - "rpc.liteverse.xyz:172.28.0.11"
    networks:
      - default
      - besu_liteverse

  challenger:
    container_name: liteverse-evm2-op-challenger
    extra_hosts:
      - "rpc.liteverse.xyz:172.28.0.11"
    networks:
      - default
      - besu_liteverse

  dispute-mon:
    container_name: liteverse-evm2-dispute-mon
    extra_hosts:
      - "rpc.liteverse.xyz:172.28.0.11"
    networks:
      - default
      - besu_liteverse
    ports: !override
      - "9730:7300"

networks:
  besu_liteverse:
    external: true
